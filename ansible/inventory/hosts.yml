# Centrally managed lab inventory (example IPs — replace before use).
# Prefer SSH keys. Do not commit production credentials.
#
# Architecture:
#   Ansible control node (where you run ansible-playbook)
#           |
#           +---- ai-node-01          (NVIDIA GPU, vLLM)
#           +---- utility-node-01     (Prometheus/Grafana, admin services)

all:
  children:
    ai_nodes:
      hosts:
        ai-node-01:
          ansible_host: 192.0.2.10
          ansible_user: rocky
          # ansible_ssh_private_key_file: ~/.ssh/id_ed25519_lab

    monitoring_nodes:
      hosts:
        utility-node-01:
          ansible_host: 192.0.2.20
          ansible_user: rocky
          # ansible_ssh_private_key_file: ~/.ssh/id_ed25519_lab
