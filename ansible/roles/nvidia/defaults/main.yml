---
# Role: nvidia — prepare host for NVIDIA GPU container workloads.
#
# Drivers are opt-in (nvidia_install_drivers: false by default). Blind driver
# installs on production/lab hosts are a common source of black screens,
# DKMS breakage, and remote lockouts. See docs/nvidia.md.

nvidia_install_drivers: false
nvidia_install_container_toolkit: true
nvidia_require_gpu: false

# Official CUDA network repo — only used when explicitly installing drivers.
nvidia_cuda_repo_enabled: false
nvidia_cuda_repo_baseurl: >-
  https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64
nvidia_cuda_repo_gpgkey: >-
  https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/D100CF5C.pub

# Package names when nvidia_install_drivers is true (pin in real labs).
nvidia_driver_packages:
  - nvidia-driver
  - nvidia-settings

nvidia_container_toolkit_packages:
  - nvidia-container-toolkit

nvidia_container_toolkit_repo_file: /etc/yum.repos.d/nvidia-container-toolkit.repo
nvidia_container_toolkit_repo_url: >-
  https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
