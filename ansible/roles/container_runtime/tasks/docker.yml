---
- name: Install yum-utils for Docker repo management
  ansible.builtin.dnf:
    name: yum-utils
    state: present

- name: Add Docker CE repository (CentOS/RHEL-compatible)
  ansible.builtin.get_url:
    url: "{{ container_runtime_docker_repo_url }}"
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Docker Engine packages
  ansible.builtin.dnf:
    name: "{{ container_runtime_docker_packages }}"
    state: present
    update_cache: true

- name: Ensure docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Verify docker is callable
  ansible.builtin.command: docker --version
  register: container_runtime_docker_version
  changed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "{{ container_runtime_docker_version.stdout }}"
