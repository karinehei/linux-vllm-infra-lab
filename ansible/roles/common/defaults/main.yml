---
# Role: common — base Rocky/RHEL 9 host configuration

common_timezone: UTC
common_update_packages: false
common_manage_hostname: false
common_hostname: "{{ inventory_hostname }}"

common_packages:
  - curl
  - wget
  - vim-enhanced
  - git
  - htop
  - tmux
  - rsync
  - tar
  - unzip
  - jq
  - python3
  - python3-pip
  - ca-certificates
  - chrony
  - pciutils
  - lsof
  - bash-completion
  - yum-utils
  - dnf-plugins-core
  - NetworkManager

common_services_enabled:
  - chronyd
