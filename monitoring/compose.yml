# Minimal monitoring stack for the research AI lab.
# Binds Prometheus/Grafana to localhost — tunnel or private NIC for remote access.
#
#   cd monitoring && podman compose up -d
#
# DCGM exporter requires an NVIDIA GPU + drivers on this host.

name: vllm-lab-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lab-prometheus
    restart: on-failure
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lab-grafana
    restart: on-failure
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-lab-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: lab-node-exporter
    restart: on-failure
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
    container_name: lab-blackbox-exporter
    restart: on-failure
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./exporters/blackbox.yml:/config/blackbox.yml:ro
    command:
      - --config.file=/config/blackbox.yml

  # GPU metrics — skip on non-GPU hosts: podman compose up -d prometheus grafana node-exporter blackbox-exporter
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    container_name: lab-dcgm-exporter
    restart: on-failure
    ports:
      - "127.0.0.1:9400:9400"
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Podman users may need: --device nvidia.com/gpu=all instead of deploy.resources

volumes:
  prometheus_data:
  grafana_data:
