---
# yamllint configuration for Ansible + GitHub Actions YAML
extends: default

ignore: |
  .venv/
  benchmarks/results/

yaml-files:
  - "*.yml"
  - "*.yaml"
  - ".yamllint.yml"
  - ".ansible-lint"

rules:
  line-length:
    max: 160
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1
  # GitHub Actions uses the key "on:" which yamllint treats as a truthy value.
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on"]
    check-keys: false
  document-start: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  comments-indentation: disable
  indentation:
    spaces: consistent
    indent-sequences: consistent
